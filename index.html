<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конус: утворення, перерізи, розгортка</title>
<style>
:root{--bg:#f1f5f9;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--acc:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#f1f5f9;--mut:#94a3b8;--card:#162033;--bd:#2b3a55;--acc:#60a5fa}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#f1f5f9;--mut:#94a3b8;--card:#162033;--bd:#2b3a55;--acc:#60a5fa}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}
#w{max-width:960px;margin:0 auto}
h1{font-size:21px;margin:2px 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button,.ctl button{font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
canvas{width:100%;display:block;touch-action:none;cursor:grab}
#cap{margin-top:8px;background:rgba(15,23,42,.8);color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;min-height:3.2em}@media(max-width:640px){#cap{min-height:5.2em}}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ctl input[type=range]{flex:1;min-width:140px}.ctl label{font-size:14px;color:var(--mut)}
#info{margin-top:4px;padding:12px 14px}.k{font-size:13px;color:var(--mut);margin:6px 2px}
</style></head><body><div id="w">
<h1>Конус: утворення, перерізи, розгортка</h1>
<div class="tabs" id="tabs"></div>
<div class="card"><canvas id="cv"></canvas><div id="cap"></div></div>
<div class="ctl"><button id="pl">⏸ Пауза</button><input type="range" id="sc" min="0" max="1" step="0.001" value="0"><label><input type="checkbox" id="au" checked> рух камери</label></div>
<div class="card" id="info"></div>
<p class="k">Перетягуйте сцену, щоб обертати. Повзунок перемотує «відео». R — радіус основи, H — висота, l — твірна.</p>
</div>
<script>
const $=i=>document.getElementById(i),cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ez=x=>x*x*(3-2*x);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],nm=a=>Math.hypot(...a),avg=a=>mul(a.reduce((s,p)=>add(s,p),[0,0,0]),1/a.length);
const R=2,H=4.5,L=Math.hypot(R,H),N=36,Y0=-.55,DD=1.2,H0=2,R1=R*(H-H0)/H,PI=Math.PI,T2=2*PI,K=[0,0,1],O3=[0,0,0],P3=[0,0,H];
const r0=[Math.cos(Y0),-Math.sin(Y0),0],nu=[-Math.sin(Y0),-Math.cos(Y0),0];
const angTo=n=>{const a=Math.atan2(nu[1],nu[0])-Math.atan2(n[1],n[0]);return Math.atan2(Math.sin(a),Math.cos(a))};
function rot(v,a,t){const c=Math.cos(t),s=Math.sin(t);return add(add(mul(v,c),mul(cross(a,v),s)),mul(a,dot(a,v)*(1-c)))}
const arc=(a0,a1,z,n,rd=R)=>Array.from({length:n+1},(_,i)=>{const t=a0+(a1-a0)*i/n;return[rd*Math.cos(t),rd*Math.sin(t),z]});
function piece(a0,a1,ra,za,rb,zb,cut,cc,piv,ax,ang,mag,sg){
const full=a1-a0>6.28,n=full?N:Math.max(8,Math.round(N*(a1-a0)/T2)),A=arc(a0,a1,za,n,ra),B=arc(a0,a1,zb,n,rb),F=[];
for(let i=0;i<n;i++)F.push({p:[A[i],A[i+1],B[i+1],B[i]],t:'s'});
if(ra>0)F.push({p:A,t:cc==1?'c':'e'});if(rb>0)F.push({p:B,t:cc==2?'c':'e'});if(cut)F.push({p:cut,t:'c'});
const ctr=avg(F.flatMap(f=>f.p));return{F,ctr,piv,ax,ang,off:mul(r0,sg*mag)}}
const w=Math.sqrt(R*R-DD*DD),al=Math.acos(DD/R),nrm=v=>mul(v,1/nm(v)),e2=nrm([-DD,0,H]),nT=nrm([H,0,DD]),cc3=[DD/2,0,H/2];
const cA=[P3,[R,0,0],[-R,0,0]],cT=[P3,[DD,w,0],[DD,-w,0]];
const CUT={
2:{pcs:[piece(0,PI,R,0,0,H,cA,0,O3,K,angTo([0,-1]),R+.5,1),piece(PI,T2,R,0,0,H,cA,0,O3,K,angTo([0,1]),R+.5,-1)],
pl:[[-3.4,0,-.6],[3.4,0,-.6],[3.4,0,H+.6],[-3.4,0,H+.6]],sh:[0,0,6],lab:[{pc:0,p:[0,0,0],t:'2R',dx:0,dy:22},{pc:0,p:[0,0,H/2],t:'H',dx:14,dy:0}],segs:[{pc:0,a:O3,b:P3,w:[.88,9]}],
cap:['Січна площина опускається зверху вниз, як ніж, і проходить через вісь конуса.','Осьовий переріз — рівнобедрений трикутник з основою 2R і висотою H. S = R·H.']},
3:{pcs:[piece(-al,al,R,0,0,H,cT,0,[DD/2,0,0],K,angTo([-1,0]),w+.6,1),piece(al,T2-al,R,0,0,H,cT,0,[DD/2,0,0],K,angTo([1,0]),R+.4,-1)],
pl:[[1,1],[1,-1],[-1,-1],[-1,1]].map(([a,b])=>add(cc3,add(mul([0,1,0],3.6*a),mul(e2,3.4*b)))),sh:[0,0,6],
lab:[{pc:0,p:P3,t:'P',dx:0,dy:-10},{pc:0,p:[DD,w,0],o:[DD,-w,0],t:'C',dx:0,dy:16},{pc:0,p:[DD,-w,0],o:[DD,w,0],t:'D',dx:0,dy:16},{pc:0,p:[DD,0,0],t:'K',dx:0,dy:18},{pc:0,p:[DD/2,0,H/2],t:'PK',dx:-16,dy:0}],segs:[{pc:0,a:P3,b:[DD,0,0],w:[.88,9]}],
cap:['Січна площина опускається зверху вниз, як ніж, і проходить через вершину та дві твірні.','Переріз через дві твірні — рівнобедрений трикутник PCD. S = ½·CD·PK, де K — середина CD.']},
4:{pcs:[piece(0,T2,R1,H0,0,H,null,1,[0,0,H0],r0,-PI/2,R+.6,-1),piece(0,T2,R,0,R1,H0,null,2,[0,0,H0],r0,PI/2,R+.6,1)],
pl:[[-3.4,-3.4,H0],[3.4,-3.4,H0],[3.4,3.4,H0],[-3.4,3.4,H0]],sh:mul(r0,-8),lab:[{pc:0,p:[R1/2,0,H0],t:'r',dx:0,dy:-8}],segs:[{pc:0,a:[0,0,H0],b:[R1,0,H0],w:[.88,9]}],
cap:['Січна площина входить збоку паралельно основі.','Переріз, паралельний основі, — круг радіуса r < R. S = πr².']}};
const INFO=['<b>Обертання прямокутного трикутника навколо катета.</b> Катет PO на осі — <b>висота H</b>, інший катет OB — <b>радіус R</b> основи, гіпотенуза PB — <b>твірна l</b>. l² = R² + H².',
'<b>Обертання рівнобедреного трикутника навколо висоти, проведеної до основи.</b> Висота PO лежить на осі, половина основи OB — радіус R, бічна сторона PB — твірна l. Достатньо пів оберту: дві половини трикутника описують весь конус.',
'<b>Осьовий переріз</b> — рівнобедрений трикутник з основою 2R і висотою H. S = R·H.',
'<b>Переріз через дві твірні</b> — рівнобедрений трикутник PCD. S = ½·CD·PK, де PK — висота трикутника, K — середина CD.',
'<b>Переріз, паралельний основі</b>, — круг радіуса r, де r : R = (H − h) : H (h — відстань від основи до площини). S = πr².',
'<b>Розгортка конуса</b>: круговий сектор радіуса l (твірна) з дугою 2πR та круг радіуса R. Кут сектора φ = 360°·R/l. S<sub>біч</sub> = πRl, S<sub>повн</sub> = πR(R + l).'];
const NAMES=['Обертання: прямокутний трикутник','Обертання: рівнобедрений трикутник','Осьовий переріз','Переріз через дві твірні','Переріз ∥ основі','Розгортка'];
const cv=$('cv'),g=cv.getContext('2d');let cs=0,T=0,play=true,drag=null,baseYaw=Y0,pitch=.35,clock=0,last=performance.now(),CW,CH,S,cy,sy,cp,sp,ctr=[0,0,H/2],capI='',FG,CARD,DUR=16;
$('tabs').innerHTML=NAMES.map((n,i)=>`<button onclick="setScene(${i})">${n}</button>`).join('');
function setScene(i){cs=i;T=0;capI='';[...$('tabs').children].forEach((b,k)=>b.classList.toggle('on',k==i));$('info').innerHTML=INFO[i]}
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;CW=r.width;CH=Math.round(CW*(CW<640?1:.62));cv.style.height=CH+'px';cv.width=CW*d;cv.height=CH*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;baseYaw+=(e.clientX-drag[0])*.008;pitch=cl(pitch+(e.clientY-drag[1])*.006,-1.2,1.3);drag=[e.clientX,e.clientY]};
cv.onpointerup=()=>{drag=null};
$('pl').onclick=()=>{play=!play;$('pl').textContent=play?'⏸ Пауза':'▶ Пуск'};$('sc').oninput=e=>{T=+e.target.value};
const ph=(a,b)=>ez(cl((T-a)/(b-a))),toV=p=>{const x=p[0]-ctr[0],y=p[1]-ctr[1],z=p[2]-ctr[2],X=x*cy-y*sy,Y=x*sy+y*cy;return[X,z*cp+Y*sp,Y*cp-z*sp]},scr=v=>[CW/2+S*v[0],CH/2-S*v[1]];
const mk=(pts,c,e)=>{const q=pts.map(toV);return{q,d:avg(q)[2],c,e}};
function flush(it){it.sort((a,b)=>b.d-a.d);for(const f of it){g.beginPath();f.q.forEach((v,j)=>{const p=scr(v);j?g.lineTo(...p):g.moveTo(...p)});g.closePath();g.fillStyle=f.c;g.fill();g.strokeStyle=f.e?'rgba(30,64,175,.85)':f.pl?'rgba(168,85,247,.8)':f.c;g.lineWidth=f.e?1.4:.8;g.stroke()}}
function seg(a,b,col,wd,dash){const p=scr(toV(a)),q=scr(toV(b));g.beginPath();g.setLineDash(dash||[]);g.moveTo(...p);g.lineTo(...q);g.strokeStyle=col;g.lineWidth=wd;g.stroke();g.setLineDash([])}
function tx(t,v,dx,dy,col){const p=scr(v);g.font='bold 16px system-ui,sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle=CARD;g.strokeText(t,p[0]+dx,p[1]+dy);g.fillStyle=col||FG;g.fillText(t,p[0]+dx,p[1]+dy)}
function drawCut(c){const sep=ez(ph(.55,.9)),fa=ph(.38,.5),it=[];
for(const pc of c.pcs){const tf=p=>add(add(rot(sub(p,pc.piv),pc.ax,pc.ang*sep),pc.piv),mul(pc.off,sep));pc.tf=tf;const vc=toV(tf(pc.ctr));
for(const f of pc.F){const q=f.p.map(p=>toV(tf(p))),cen=avg(q);let n=cross(sub(q[1],q[0]),sub(q[2],q[0]));if(dot(n,sub(cen,vc))<0)n=mul(n,-1);
const nn=mul(n,1/(nm(n)||1)),fr=nn[2]<-1e-6,sh=.6+.4*Math.max(0,dot(nn,[.3,.55,-.78]));let col,a;
if(f.t=='c'){col=[249,115,22];a=fr?fa*.92:fa*.55*(1-sep)}else{col=f.t=='e'?[147,197,253]:[96,165,250];a=fr?.5+.45*sep:.28*(1-sep)}
if(a>=.02)it.push({q,d:cen[2],c:`rgba(${col.map(x=>x*sh|0)},${a})`,e:f.t!='s'&&fr})}}
const s=ez(ph(.15,.4)),pa=.24*cl((T-.12)/.05)*(1-ez(ph(.52,.62)));
if(pa>.01){const q=c.pl.map(p=>toV(add(p,mul(c.sh,1-s))));it.push({q,d:avg(q)[2],c:`rgba(168,85,247,${pa})`,pl:1})}
flush(it);
for(const s of c.segs)if(sep>.85){const pc=c.pcs[s.pc];seg(pc.tf(s.a),pc.tf(s.b),'#dc2626',4)}
for(const l of c.lab)if(sep>.85){const pc=c.pcs[l.pc],q=pc.tf(l.p);let dx=l.dx;if(l.o)dx=scr(toV(q))[0]<scr(toV(pc.tf(l.o)))[0]?-14:14;tx(l.t,toV(q),dx,l.dy)}}
function drawRot(v){const phi=(v?PI:T2)*ph(.2,.8),it=[],c=Math.cos(phi),s=Math.sin(phi);
const sw=(a0,a1)=>{const n=Math.ceil(N*(a1-a0)/T2);if(n<1)return;const A=arc(a0,a1,0,n);for(let i=0;i<n;i++)it.push(mk([P3,A[i],A[i+1]],'rgba(96,165,250,.4)'));it.push(mk([O3,...A],'rgba(147,197,253,.5)'))};
sw(0,phi);if(v)sw(PI,PI+phi);
const Bp=[R*c,R*s,0],B2=[-R*c,-R*s,0];it.push(mk(v?[P3,Bp,B2]:[P3,O3,Bp],'rgba(249,115,22,.6)'));flush(it);
seg([0,0,-.8],[0,0,H+.8],FG,1,[6,5]);seg(O3,P3,'#2563eb',5);seg(O3,Bp,'#dc2626',5);seg(P3,Bp,'#16a34a',4);if(v){seg(O3,B2,'#dc2626',5);seg(P3,B2,'#16a34a',4)}
const mid=(a,b)=>mul(add(a,b),.5);
tx('P',toV(P3),0,-10);tx('O',toV(O3),-14,16);tx('B',toV(Bp),10,16);if(v)tx('B′',toV(B2),-14,16);
tx('H',toV(mid(O3,P3)),-16,0,'#2563eb');tx('R',toV(mid(O3,Bp)),0,22,'#dc2626');if(T>.1)tx('l',toV(mid(P3,Bp)),16,0,'#16a34a');
if(T>.8){const b=toV([0,0,-.8]);tx('R — радіус (OB ⟂ осі)',b,0,24,'#dc2626');tx('H — висота (PO на осі)',b,0,46,'#2563eb');tx('l — твірна (PB)',b,0,68,'#16a34a')}}
function drawUnroll(){const u=ph(.3,.7),cu=ph(.15,.35),mv=ph(.65,.9),s0=R/L,sb=s0+(1-s0)*u,om=T2*s0/sb,za=L*Math.sqrt(1-sb*sb),M=48,it=[];
const dir=t=>{const a=om*t;return add(mul(nu,-Math.cos(a)),mul(r0,Math.sin(a)))},ap=[0,0,za],rr=[];
for(let i=0;i<=M;i++)rr.push(mul(dir(-.5+i/M),L*sb));
for(let i=0;i<M;i++)it.push(mk([ap,rr[i],rr[i+1]],`rgba(96,165,250,${i%2?.82:.9})`));
const dc=add(mul(nu,-(L+R)*mv),[0,0,1.4*Math.sin(PI*mv)]);
it.push(mk(arc(0,T2,0,N).map(p=>add(p,dc)),'rgba(147,197,253,.92)',1));flush(it);
if(cu>0){const tip=add(ap,mul(sub(rr[0],ap),cu));if(u<.02)seg(ap,tip,'#dc2626',4);else{seg(ap,rr[0],'#dc2626',4);seg(ap,rr[M],'#dc2626',4)}if(cu<1)tx('✂',toV(tip),0,6,'#dc2626')}
if(u>.98&&mv>.95){tx('l',toV(mul(rr[0],.5)),-14,0,'#16a34a');tx('дуга 2πR',toV(add(rr[M/2],mul(nu,-.9))),0,0);tx('φ ≈ '+Math.round(360*R/L)+'°',toV(mul(rr[M/2],.3)),0,0);
seg(dc,add(dc,[R,0,0]),'#dc2626',3);tx('R',toV(add(dc,[R/2,0,0])),0,-8,'#dc2626')}}
function caption(){const CP=[[[.2,'Беремо прямокутний трикутник POB. Катет PO лежить на осі обертання.'],[.8,'Обертаємо навколо катета PO: катет OB описує основу, гіпотенуза PB — бічну поверхню.'],[9,'Утворився конус: PO = H — висота, OB = R — радіус, PB = l — твірна.']],
[[.2,'Беремо рівнобедрений трикутник PBB′. Висота PO до основи лежить на осі.'],[.8,'Обертаємо навколо висоти PO: достатньо пів оберту — дві половини трикутника описують весь конус.'],[9,'Утворився той самий конус: PO = H, OB = R (половина основи BB′), PB = l.']],0,0,0,
[[.15,'Конус: бічна поверхня й основа.'],[.35,'Розрізаємо бічну поверхню по твірній.'],[.65,'Розгортаємо бічну поверхню в площину: виходить круговий сектор.'],[.9,'Відокремлюємо основу й прикладаємо до дуги сектора.'],[9,'Розгортка: сектор радіуса l з дугою 2πR і круг радіуса R.']]];
let l=CP[cs];if(!l){const c=CUT[cs];l=[[.15,'Конус з радіусом основи R і висотою H.'],[.4,c.cap[0]],[.55,'Переріз заливаємо кольором.'],[.9,'Розрізаємо й розводимо частини, повертаючи перерізом до нас.'],[9,c.cap[1]]]}
const t=l.find(x=>T<x[0])[1];if(t!=capI){capI=t;$('cap').textContent=t}}
function draw(){const st=getComputedStyle(document.documentElement);FG=st.getPropertyValue('--fg').trim();CARD=st.getPropertyValue('--card').trim();
const yaw=baseYaw+($('au').checked&&!drag?.35*Math.sin(clock*.5):0);cy=Math.cos(yaw);sy=Math.sin(yaw);
const pe=Math.min(1.4,pitch+(cs==5?.6*ph(.6,.95):0));cp=Math.cos(pe);sp=Math.sin(pe);
ctr=cs==5?add(mul([0,0,H/2],1-ph(.3,.9)),mul(mul(nu,-4.4),ph(.3,.9))):[0,0,H/2];
S=Math.min(CW/[10,10,13,13,13,11][cs],CH/[8,8,8,8,8,11][cs]);g.clearRect(0,0,CW,CH);g.lineCap='round';
if(cs<2)drawRot(cs);else if(cs==5)drawUnroll();else drawCut(CUT[cs]);caption()}
function frame(n){const d=Math.min(.05,(n-last)/1000);last=n;clock+=d;if(play){T+=d/DUR;if(T>1.12)T=0}$('sc').value=Math.min(T,1);draw();requestAnimationFrame(frame)}
size();setScene(0);requestAnimationFrame(frame);
</script></body></html>
